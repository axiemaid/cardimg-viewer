<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARDIMG Explorer</title>
  <meta name="description" content="On-chain card image registry — browse images inscribed on the BSV blockchain">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
</head>
<body>
  <header id="topbar">
    <div class="brand" id="brand-link">
      <span class="logo">🃏</span>
      <span class="title">CARDIMG Explorer</span>
    </div>
    <div class="tab-toggle" id="tab-toggle">
      <button class="tab-btn active" data-tab="uploads">Uploads</button>
      <button class="tab-btn" data-tab="cards">Cards</button>
    </div>
    <div class="stats" id="stats-bar">
      <span id="stat-count">—</span> uploads
    </div>
    <button id="refresh-btn" class="refresh-btn" title="Refresh">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </header>

  <div id="app">
    <!-- Gallery views (uploads + cards tabs) -->
    <div id="gallery-view">
      <!-- Uploads Tab -->
      <main id="gallery" class="view active">
        <div class="page-header">
          <h1>Newest Uploads</h1>
        </div>
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p>Loading uploads from chain…</p>
        </div>
        <div id="grid" class="grid" style="display:none"></div>
        <div id="empty" class="empty" style="display:none">
          <p>No uploads indexed yet.</p>
        </div>
      </main>

      <!-- Cards Tab -->
      <main id="sets-view" class="view" style="display:none">
        <div class="page-header">
          <h1>Cards</h1>
        </div>
        <div id="sets-loading" class="loading">
          <div class="spinner"></div>
          <p>Loading cards from chain…</p>
        </div>
        <div id="sets-grid" class="sets-grid" style="display:none"></div>
        <div id="sets-empty" class="empty" style="display:none">
          <p>No cards indexed yet.</p>
        </div>
      </main>
    </div>

    <!-- Upload Detail Page (/cardimg/:txid) -->
    <div id="upload-page" style="display:none">
      <div class="page-header">
        <a href="/" class="back-link">← Back</a>
        <h1>Upload</h1>
      </div>
      <div class="detail-layout">
        <div class="detail-image-wrap">
          <img id="upload-image" src="" alt="Card image">
        </div>
        <div class="detail-meta" id="upload-meta"></div>
      </div>
    </div>

    <!-- Card Detail Page (/card/:txid) -->
    <div id="card-page" style="display:none">
      <div class="page-header">
        <a href="/" class="back-link">← Back</a>
        <h1>Card</h1>
      </div>
      <div class="card-detail-body">
        <div class="card-detail-txid" id="card-detail-txid"></div>
        <div class="set-members" id="card-detail-members"></div>
      </div>
    </div>
  </div>

  <footer>
    <a href="https://whatsonchain.com" target="_blank" rel="noopener">Powered by WhatsOnChain</a>
    <span class="sep">·</span>
    <span>CARDIMG Protocol</span>
  </footer>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
